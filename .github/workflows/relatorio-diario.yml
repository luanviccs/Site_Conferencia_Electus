# Relatório diário da Conferência Electus: todo dia às 08:00 (Brasília) gera o slide com acessos, cliques em ingresso
# e vendas do dia anterior e envia por e-mail. Também pode ser disparado à mão em Actions → "Relatório diário" → Run workflow.
# Código em automacao/relatorio-diario/ (fora do site: não entra no build nem na publicação da Vercel).
name: Relatório diário

on:
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC = 08:00 em Brasília
  workflow_dispatch:
    inputs:
      dia:
        description: "Dia do relatório (AAAA-MM-DD). Vazio = ontem."
        required: false

permissions:
  contents: read

concurrency:
  group: relatorio-diario
  cancel-in-progress: false

jobs:
  relatorio:
    name: Gerar e enviar relatório
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: automacao/relatorio-diario
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: automacao/relatorio-diario
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automacao/relatorio-diario/requirements.txt
      - run: pip install -r requirements.txt
      - name: Gerar e enviar
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_CREDENTIALS_JSON: ${{ secrets.GA4_CREDENTIALS_JSON }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RELATORIO_PARA: ${{ secrets.RELATORIO_PARA }}
          VENDAS_REMETENTE: ${{ vars.VENDAS_REMETENTE }}
          VENDAS_ASSUNTO: ${{ vars.VENDAS_ASSUNTO }}
          DIA: ${{ inputs.dia }}
        run: python relatorio.py ${DIA:+--dia "$DIA"}
      - name: Guardar o slide (14 dias)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-electus
          path: automacao/relatorio-diario/saida/
          if-no-files-found: ignore
          retention-days: 14
