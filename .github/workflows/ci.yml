# Verificação automática a cada envio para a main e em pull requests:
# instala as dependências exatamente como no package-lock, confere os tipos, gera o build de produção
# e audita as dependências que vão para o site (falha só em vulnerabilidade alta ou crítica).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tipos, build e auditoria
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
